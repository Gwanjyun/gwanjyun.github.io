<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{name} · AIGC 算法工程师</title>
  <meta name="description" content="{name}（AIGC 算法工程师）的个人主页：图像超分辨率、图像与视频生成、扩散模型可控生成的研究与落地实践。">
  <meta property="og:title" content="{name} · AIGC 算法工程师">
  <meta property="og:description" content="AIGC 图像与视频生成 · 图像超分辨 · CVPR 2025 一作">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23111'/><text x='50' y='68' font-size='46' text-anchor='middle' fill='%23fff' font-family='monospace'>D</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">
  <div id="siteHeader"></div>

  <main>
    <!-- Hero -->
    <section class="hero">
      <div class="container hero-grid">
        <div>
          <div class="eyebrow" id="heroEyebrow">AIGC · Image &amp; Video · Super-Resolution</div>
          <h1 class="hero-title" id="heroText">把文生图大模型，用到真实的影像修复与生成里。</h1>
          <p class="lead" id="heroLead"></p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="research.html">了解我的研究 →</a>
            <a class="btn btn-ghost" href="contact.html">与我联系</a>
          </div>
        </div>

        <aside class="avatar-card">
          <div class="avatar-photo" id="avPhoto">
            <span class="avatar-initials" id="avInitials">D</span>
            <img id="avImg" alt="" style="display:none;">
          </div>
          <div class="avatar-name" id="avName"></div>
          <div class="avatar-name-en" id="avNameEn"></div>
          <div class="avatar-title" id="avTitle"></div>
          <div class="avatar-headline" id="avHeadline"></div>
          <a class="avatar-email" id="avEmail" href="#"></a>
        </aside>
      </div>
    </section>

    <!-- 统计：数字由 data/content.json 的 stats 配置自动计算 -->
    <div class="container">
      <div class="stats-row reveal" id="statsRow" data-render>
        <div class="stat-card">
          <div class="num">–</div>
          <div class="lbl">加载中…</div>
        </div>
      </div>
    </div>

    <!-- 研究方向 -->
    <section>
      <div class="container">
        <div class="section-head">
          <h2>研究方向</h2>
          <p>我的研究围绕「让生成式 AI 更好地服务于真实影像任务」展开，横跨模型、数据与应用多个层面。</p>
        </div>
        <div class="grid-3" id="researchCards" data-render></div>
      </div>
    </section>

    <!-- 工作经历 -->
    <section>
      <div class="container">
        <div class="section-head">
          <h2>工作经历</h2>
          <p>在产业与研究领域的工作轨迹。</p>
        </div>
        <div class="exp-list" id="workExperience" data-render></div>
      </div>
    </section>

    <!-- 项目经历 -->
    <section>
      <div class="container">
        <div class="section-head">
          <h2>项目经历</h2>
          <p>参与或主导过的代表性项目。</p>
        </div>
        <div class="exp-list" id="projectExperience" data-render></div>
      </div>
    </section>

    <!-- 发表论文 -->
    <section>
      <div class="container">
        <div class="section-head">
          <h2>发表论文</h2>
          <p>代表性学术成果，完整列表见研究页。</p>
        </div>
        <div class="paper-grid" id="paperCards" data-render></div>
        <div class="section-foot">
          <a class="btn btn-ghost" href="research.html">全部成果 →</a>
        </div>
      </div>
    </section>

    <!-- 近期文章 -->
    <section id="postsSection">
      <div class="container">
        <div class="section-head">
          <h2>近期文章</h2>
          <p>关于 AIGC 的观察、研究与工程实践。</p>
        </div>
        <div class="blog-list" id="featuredPosts" data-render></div>
        <div class="section-foot">
          <a class="btn btn-ghost" href="blog.html">查看全部 →</a>
        </div>
      </div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script src="js/partials.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
