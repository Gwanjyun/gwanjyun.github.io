<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系 | {name} · AIGC</title>
  <meta name="description" content="与{name}联系：学术合作、技术交流与内容共创。">

<body data-page="contact">

      </p>
    </section>

    <section style="padding-top:10px;">
      <div class="section-head">
        <h2 id="contactName"></h2>
        <p>期待与对 AIGC 充满热情的你，在技术、艺术与工程落地之间相遇。</p>
      </div>
      <div class="contact-links" id="contactCards" data-render></div>
      <p style="margin-top:22px;color:var(--ink-faint);font-size:.86rem;">
        也可以直接发邮件到 <a class="avatar-email" id="contactEmail" href="#"></a>
      </p>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script src="js/partials.js"></script>
